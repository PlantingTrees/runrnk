services:
  app:
    build: .
    ports:
      - "8080:8080"  
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://INSERTRDS:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=INSERTPASSWORD
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    
    # If the server restarts, start the app automatically
    restart: always